<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f0e7"><title>منوی دارکو | Darco</title>
<style>
:root{--cream:#f5f0e7;--ink:#171717;--red:#c8322b;--muted:#77736c;--line:#e4ddd1;--white:#fffdf8}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Tahoma,Arial,sans-serif}header{padding:26px 20px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:16px;max-width:1000px;margin:auto}.brand{font-weight:900;font-size:25px;letter-spacing:2px}.brand span{color:var(--red)}.tag{font-size:12px;color:var(--muted);margin-top:7px}.top-note{font-size:12px;border:1px solid var(--line);padding:8px 12px;border-radius:99px}main{max-width:1000px;margin:auto;padding:24px 18px 50px}.intro{margin:12px 0 24px}.intro h1{font-size:clamp(25px,5vw,40px);margin:0 0 8px;letter-spacing:-1px}.intro p{color:var(--muted);margin:0;line-height:1.9}.categories{display:flex;gap:8px;overflow:auto;padding:4px 0 18px}.cat{border:1px solid var(--line);background:transparent;padding:10px 16px;border-radius:99px;white-space:nowrap;cursor:pointer;font:inherit}.cat.active{background:var(--ink);color:white;border-color:var(--ink)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:15px}.item{background:var(--white);border:1px solid var(--line);border-radius:17px;overflow:hidden}.photo{height:180px;background:#e9e1d5;display:grid;place-items:center;color:#9a8e7d;font-size:12px;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.details{padding:15px}.name-row{display:flex;align-items:start;justify-content:space-between;gap:8px}.name{font-size:17px;font-weight:800;margin:0}.price{font-size:15px;font-weight:900;color:var(--red);white-space:nowrap}.desc{font-size:12px;color:var(--muted);line-height:1.9;margin:10px 0 0;min-height:24px}.empty,.loading{padding:35px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px;grid-column:1/-1}.footer{text-align:center;color:var(--muted);font-size:11px;padding:28px 10px 8px}.dot{display:inline-block;width:7px;height:7px;background:var(--red);border-radius:50%;margin-left:7px}@media(max-width:480px){header{padding:20px 16px}.top-note{display:none}.photo{height:160px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.details{padding:12px}.name{font-size:14px}.price{font-size:12px}.desc{font-size:11px}.photo{height:135px}}
</style></head>
<body>
<header><div><div class="brand">DARCO<span>.</span></div><div class="tag">COFFEE · ROASTERY · GILAVAND</div></div><div class="top-note"><span class="dot"></span> منوی به‌روز دارکو</div></header>
<main><section class="intro"><h1>منوی دارکو</h1><p>برای انتخاب قهوه‌ی بعدی‌ات، بگرد و پیدا کن.</p></section><nav class="categories" id="categories" aria-label="دسته‌بندی‌ها"><button class="cat active" data-id="all">همه</button></nav><section class="grid" id="items"><div class="loading">در حال دریافت منو…</div></section><div class="footer">DARCO ROASTERY · Fresh coffee, bold character.</div></main>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const SUPABASE_URL='https://jcpdzqilnhnljvrfsjug.supabase.co';
const SUPABASE_KEY='sb_publishable_IsYn6XHFo7AUOfE0BDyfZA_sjavx6Vr';
const db=createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s);let active='all',categories=[],items=[];
const money=n=>new Intl.NumberFormat('fa-IR').format(Number(n)||0)+' تومان';
function imageUrl(path){if(!path)return '';return db.storage.from('menu-images').getPublicUrl(path).data.publicUrl}
function renderCats(){const nav=$('#categories');nav.innerHTML='';[['all','همه'],...categories.map(c=>[c.id,c.name])].forEach(([id,name])=>{const b=document.createElement('button');b.className='cat'+(active===id?' active':'');b.textContent=name;b.onclick=()=>{active=id;renderCats();renderItems()};nav.append(b)})}
function renderItems(){const root=$('#items');root.innerHTML='';const shown=items.filter(i=>active==='all'||i.category_id===active);if(!shown.length){root.innerHTML='<div class="empty">هنوز آیتمی برای نمایش ثبت نشده است.</div>';return}shown.forEach(i=>{const card=document.createElement('article');card.className='item';const ph=document.createElement('div');ph.className='photo';if(i.image_path){const img=document.createElement('img');img.loading='lazy';img.alt=i.name;img.src=imageUrl(i.image_path);img.onerror=()=>{ph.textContent='DARCO COFFEE'};ph.append(img)}else ph.textContent='DARCO COFFEE';const d=document.createElement('div');d.className='details';const row=document.createElement('div');row.className='name-row';const h=document.createElement('h2');h.className='name';h.textContent=i.name;const p=document.createElement('div');p.className='price';p.textContent=money(i.price);row.append(h,p);const desc=document.createElement('p');desc.className='desc';desc.textContent=i.description||'';d.append(row,desc);card.append(ph,d);root.append(card)})}
async function load(){const [c,i]=await Promise.all([db.from('menu_categories').select('id,name,slug,sort_order').eq('is_active',true).order('sort_order'),db.from('menu_items').select('id,category_id,name,description,price,image_path,sort_order').eq('is_available',true).order('sort_order')]);if(c.error||i.error){$('#items').innerHTML='<div class="empty">فعلاً دریافت منو ممکن نیست. لطفاً کمی بعد دوباره تلاش کنید.</div>';console.error(c.error||i.error);return}categories=c.data||[];items=i.data||[];renderCats();renderItems()}load();
</script></body></html>
